# CSULB Notice of Absence — form profile for reg-admin-form.
#
# Route: SSO → "Notice of Absence" chiclet → opens in DocuSign → complete →
# submit. DocuSign asks for the routing addresses by hand; they are pinned below
# so they are never retyped from memory.
#
# ⚠ The `fields:` list is the shape of the DocuSign packet as of 2026-09.
# If the packet asks for something else, edit THIS FILE — not the code. Fields
# with `source: prompt` are the ones only a human can answer.

form: notice-of-absence
title: CSULB Notice of Absence from Class / Class Cancellation / Temporary Instruction Mode Change
authority: >-
  SSO → "Notice of Absence" chiclet → DocuSign PowerForm. Screen 1 is the
  signer-information gate (a name + email per role); the absence form follows.
submit-via: DocuSign
hours-per-day: 8   # only for the vault record; the form asks for no hours

# ⚠ PLACEHOLDER ADDRESSES. This profile ships publicly, so it carries no real
# people. Put your department's actual chair / coordinator / associate-dean
# addresses in YOUR VAULT'S copy at classes/admin-forms/, which shadows this
# file — `reg-admin-form init` puts one there for exactly this reason.
routing:
  - role: Department Chair
    email: chair@example.edu
    to: true
  - role: CC — Associate Dean
    email: associate.dean@example.edu
  - role: CC — Department Coordinator / Timekeeper
    email: coordinator@example.edu

leave-types:
  sick:
    label: Sick Leave
    key: sick
    note: Own illness, injury, or medical appointment.
    defaults:
      reason: Illness/Sick Leave
  personal-holiday:
    label: Personal Holiday
    key: personal-holiday
    note: One per calendar year; does not carry over.
    # The personal holiday is contractual time off, not discretionary leave the
    # campus grants on the strength of a reason. Nobody is owed one.
    defaults:
      reason: Personal Holiday or Other Authorized Leave
    guidance: >-
      A personal holiday is contractual. The form has a checkbox for it —
      tick "Personal Holiday or Other Authorized Leave" and stop there. The
      required "Other:" box takes a placeholder; do not explain yourself in it.
  personal-business:
    label: Personal Business
    key: personal-business
    note: Charged against sick leave, capped per the CBA.
    defaults:
      reason: Personal Holiday or Other Authorized Leave
  family-illness:
    label: Sick Leave — Family Care
    key: family-illness
    note: Illness of a family member, charged against sick leave.
    defaults:
      reason: Personal or Family Emergency
  bereavement:
    label: Bereavement Leave
    key: bereavement
    defaults:
      reason: Personal or Family Emergency
  jury-duty:
    label: Jury Duty
    key: jury-duty
    defaults:
      reason: Other
      reason-other: Jury duty
  professional-development:
    label: Professional Development / Conference
    key: professional-development
    note: Attach the agenda or acceptance when one exists.
    defaults:
      reason: Professional Conference or Professional Activity

fields:
  # ── Screen 1: the PowerForm "Signer Information" gate ────────────────────
  # Name/email pairs, in the order DocuSign lists the roles. ⚠ Note the order:
  # Faculty, Chair, Associate Dean, THEN Coordinator — the dean comes before
  # the coordinator on screen, which is NOT the order the instruction email
  # lists them in.
  - label: "Faculty — Your Name"
    key: faculty-name
    section: Screen 1 — PowerForm Signer Information
    source: instructor.name
  - label: "Faculty — Your Email"
    key: faculty-email
    section: Screen 1 — PowerForm Signer Information
    source: instructor.campus-email
  - label: "Department Chair — Name"
    key: chair-name
    section: Screen 1 — PowerForm Signer Information
    source: instructor.chair
  - label: "Department Chair — Email"
    key: chair-email
    section: Screen 1 — PowerForm Signer Information
    source: literal:chair@example.edu
  - label: "Associate Dean — Name"
    key: dean-name
    section: Screen 1 — PowerForm Signer Information
    source: instructor.associate-dean
  - label: "Associate Dean — Email"
    key: dean-email
    section: Screen 1 — PowerForm Signer Information
    source: literal:associate.dean@example.edu
  - label: "Department Coordinator — Name"
    key: coordinator-name
    section: Screen 1 — PowerForm Signer Information
    source: instructor.coordinator
  - label: "Department Coordinator — Email"
    key: coordinator-email
    section: Screen 1 — PowerForm Signer Information
    source: literal:coordinator@example.edu

  # ── Screen 2: the form itself ────────────────────────────────────────────
  # ✅ VERIFIED against a completed envelope (2026-09-06, form "Revised August
  # 2026"). This is NOT a timekeeping form — there is no employee ID, no hours,
  # no department or college. It is an academic class-delivery form governed by
  # CFA CBA Article 24.6, and it asks only about the classes.
  - label: Faculty Name
    key: faculty-name-form
    section: Screen 2 — Notice of Absence from Class
    source: instructor.name
  - label: Class Number and Title
    key: class-number-title
    section: Screen 2 — Notice of Absence from Class
    source: classes.numbers-titles
    block: true
    hint: The registrar's identifiers, not the meeting logistics.
  - label: "Date(s) of Absence / Class Cancelation / Modality Changes"
    key: absence-dates
    section: Screen 2 — Notice of Absence from Class
    source: absence.dates
  - label: Select the type of changes to class delivery
    key: delivery-change
    section: Screen 2 — Notice of Absence from Class
    source: prompt
    choices:
      - Faculty Absence but Class Not Cancelled
      - Class Cancellations
      - Request Temporary Instruction Mode Change [Prior Approval Required]
    hint: >-
      Pick by what actually happens to the meeting. A substitute or an unchanged
      mode is the first; the meeting simply not happening is the second; moving
      a face-to-face meeting to asynchronous or online is the third — and that
      one needs the chair's approval IN ADVANCE. The form states plainly that
      illness, emergency or travel does not by itself authorize a mode change.
  - label: "Reason for the Change — select the primary reason"
    key: reason
    section: Screen 2 — Notice of Absence from Class
    source: prompt
    choices:
      - Illness/Sick Leave
      - Personal or Family Emergency
      - University-Authorized Travel
      - Professional Conference or Professional Activity
      - Personal Holiday or Other Authorized Leave
      - Other
  - label: "Other:"
    key: reason-other
    section: Screen 2 — Notice of Absence from Class
    source: "literal:N/A"
    hint: >-
      ⚠ DocuSign marks this REQUIRED even when you ticked one of the named
      reasons above. A placeholder satisfies it; you are not obliged to
      elaborate on a reason the form already has a checkbox for.
  - label: Arrangement for the Scheduled Class
    key: coverage
    section: Screen 2 — Notice of Absence from Class
    source: prompt
    block: true
    hint: >-
      Substitute instructor, alternative assignment or activity, or the approved
      temporary instructional mode. Paste this text alone — no "Coverage:" label
      and no sign-off.
  - label: "For CC: Dept Coordinator/Timekeeper Email"
    key: cc-coordinator
    section: Screen 2 — Notice of Absence from Class
    source: literal:coordinator@example.edu
    hint: Asked again on the form itself, not only in the signer gate.
  - label: "For CC: Associate Dean Email"
    key: cc-dean
    section: Screen 2 — Notice of Absence from Class
    source: literal:associate.dean@example.edu

email:
  # The heads-up goes to the timekeeper who processes it; the chair is copied.
  # DocuSign handles the chair's signature separately, via `routing:` above.
  to: coordinator@example.edu
  cc: [chair@example.edu]
  subject: "Notice of Absence — {{leave-type}}, {{absence.dates}}"
  body: |
    Hello,

    I'm submitting a Notice of Absence for {{leave-type}} on {{absence.dates}}.

    Classes affected:

    {{classes.lines}}

    Coverage:

    {{coverage}}

    I'll complete the form in DocuSign and route it to the chair, with you and
    the associate dean copied.

    Thank you,
